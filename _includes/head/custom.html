<style>
  /* 사이드바 설명문. 원래 .author__urls 안의 <li> 였는데 그 목록이
     925px 미만에서 숨겨져 모바일에서 보이지 않았습니다. 항상 표시되는
     .author__content 로 옮기면서 스타일을 여기로 가져왔습니다. */
  .author__desc {
    margin: .5em 0 0;
    font-family: "Trebuchet MS", Helvetica, sans-serif;
    font-size: .8em;
    line-height: 1.5;
    white-space: normal;
  }
  @media (min-width: 57.8125em) {
    .author__desc { margin: 0 0 1em; font-size: .75em; }
  }

  /* Easter egg trigger: must read as ordinary text, not a link. */
  .egg-trigger {
    color: inherit;
    text-decoration: none;
    cursor: inherit;
    -webkit-user-select: none;
    user-select: none;
  }
</style>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    var el = document.querySelector('.egg-trigger');
    if (!el) { return; }
    var need = parseInt(el.getAttribute('data-egg-clicks'), 10) || 4;
    var url = el.getAttribute('data-egg-url');
    if (!url) { return; }
    var hits = 0, timer = null;
    el.addEventListener('click', function () {
      hits += 1;
      if (timer) { clearTimeout(timer); }
      if (hits >= need) { window.location.href = url; return; }
      // Reset if the clicks are not consecutive, so stray clicks never accumulate.
      timer = setTimeout(function () { hits = 0; }, 2000);
    });
  });
</script>
