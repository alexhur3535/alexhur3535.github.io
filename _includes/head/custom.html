<style>
  /* Easter egg trigger: must read as ordinary text, not a link. */
  .egg-trigger {
    color: inherit;
    text-decoration: none;
    cursor: inherit;
    -webkit-user-select: none;
    user-select: none;
  }
</style>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    var el = document.querySelector('.egg-trigger');
    if (!el) { return; }
    var need = parseInt(el.getAttribute('data-egg-clicks'), 10) || 4;
    var url = el.getAttribute('data-egg-url');
    if (!url) { return; }
    var hits = 0, timer = null;
    el.addEventListener('click', function () {
      hits += 1;
      if (timer) { clearTimeout(timer); }
      if (hits >= need) { window.location.href = url; return; }
      // Reset if the clicks are not consecutive, so stray clicks never accumulate.
      timer = setTimeout(function () { hits = 0; }, 2000);
    });
  });
</script>
